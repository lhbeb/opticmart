<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="omOpticBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="omLensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Precision Dual-Lens / Reticle Optics Emblem -->
  <g transform="translate(14, 15)">
    <!-- Outer Precision Aperture Ring -->
    <circle cx="30" cy="30" r="27" fill="#0F172A" stroke="url(#omLensRing)" stroke-width="3.5" />
    <!-- Glass Element Optical Flare Effect -->
    <circle cx="30" cy="30" r="21" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" />
    <!-- Tactical Reticle Inner Circle with Tick Marks -->
    <circle cx="30" cy="30" r="13" fill="none" stroke="#E2E8F0" stroke-width="1.8" stroke-dasharray="3 2.5" />
    <circle cx="30" cy="30" r="3.5" fill="url(#omOpticBlue)" />
    <!-- Milliradian Precision Crosshairs -->
    <line x1="30" y1="2" x2="30" y2="11" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="49" x2="30" y2="58" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="2" y1="30" x2="11" y2="30" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="49" y1="30" x2="58" y2="30" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="86" y="52" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
    Optic<tspan fill="url(#omOpticBlue)" font-weight="800">Mart</tspan>
  </text>
  <text x="88" y="71" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="3.2">
    CAMERAS &amp; BINOCULARS
  </text>
</svg>